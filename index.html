<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="把每天的待辦丟進艾森豪四象限，做完一件就在對應顏色的方塊上填一格。">
<title>象限方塊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── 色票（淺色為基準；深色與 toggle 只覆蓋 token）────────────── */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface-2:#F4F6F9; --line:#DCE0E7;
  --ink:#1A1D23; --ink-2:#585F6B; --ink-3:#8B909C;
  --cell-empty:#E1E5EC; --cell-edge:rgba(0,0,0,.06);
  --q1:#E5484D; --q2:#3B6FF0; --q3:#E7A413; --q4:#27A567;
  --accent:#3B6FF0; --shadow:0 1px 2px rgba(20,24,33,.06),0 8px 24px -12px rgba(20,24,33,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#191D24; --surface-2:#20252E; --line:#2B313B;
  --ink:#ECEFF4; --ink-2:#A3AAB7; --ink-3:#6C7280;
  --cell-empty:#242A33; --cell-edge:rgba(255,255,255,.05);
  --q1:#F0575C; --q2:#5B87F5; --q3:#F0B02C; --q4:#33BD7C;
  --accent:#5B87F5; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191D24; --surface-2:#20252E; --line:#2B313B;
  --ink:#ECEFF4; --ink-2:#A3AAB7; --ink-3:#6C7280;
  --cell-empty:#242A33; --cell-edge:rgba(255,255,255,.05);
  --q1:#F0575C; --q2:#5B87F5; --q3:#F0B02C; --q4:#33BD7C;
  --accent:#5B87F5; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

main{max-width:560px;margin:0 auto;padding:28px 20px 64px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.title{font-size:23px;font-weight:700;letter-spacing:.01em;line-height:1.15;text-wrap:balance}
.subtitle{color:var(--ink-2);font-size:13px;margin-top:4px}
.reset{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font:500 12px/1 "IBM Plex Mono",monospace;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
  transition:border-color .15s,color .15s}
.reset:hover{color:var(--ink);border-color:var(--ink-3)}
.reset.confirm{color:var(--q1);border-color:var(--q1)}

/* ── 盤面 ─────────────────────────────────────────────────── */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.axis-x{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;padding:0 2px 8px}
.board-row{display:flex;gap:12px;align-items:stretch}
.axis-y{display:flex;flex-direction:column;justify-content:space-between;
  font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);writing-mode:vertical-rl;text-orientation:mixed;
  padding:2px 0}
.board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  gap:5px;aspect-ratio:1/1;position:relative}
.board::before,.board::after{content:"";position:absolute;background:var(--line);z-index:2;pointer-events:none}
.board::before{left:calc(50% - 1px);top:-4px;bottom:-4px;width:2px}
.board::after{top:calc(50% - 1px);left:-4px;right:-4px;height:2px}
.cell{border-radius:6px;background:var(--cell-empty);box-shadow:inset 0 0 0 1px var(--cell-edge);
  position:relative;transition:background-color .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s}
.cell.on{background:var(--qc);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),
             inset 0 4px 7px -3px rgba(255,255,255,.5),
             inset 0 -6px 10px -4px rgba(0,0,0,.4)}
.cell.pop{animation:pop .34s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{0%{transform:scale(.55);opacity:.4}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.qtag{position:absolute;top:4px;left:6px;font:600 9.5px/1 "IBM Plex Mono",monospace;
  letter-spacing:.06em;color:var(--ink-3);opacity:.9;z-index:3;pointer-events:none}

.summary{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;margin:0 4px 26px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--cell-empty);overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--q1),var(--q3),var(--q4),var(--q2));
  transition:width .4s cubic-bezier(.2,.8,.3,1)}
.summary b{color:var(--ink);font-weight:600}

/* ── 新增列 ───────────────────────────────────────────────── */
.add{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;
  box-shadow:var(--shadow);margin-bottom:24px}
.add-row{display:flex;gap:8px}
.add input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  border-radius:9px;padding:11px 13px;font-size:15px;font-family:inherit}
.add input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.add button.go{border:none;background:var(--ink);color:var(--surface);border-radius:9px;
  padding:0 16px;font:600 14px/1 inherit;cursor:pointer;white-space:nowrap}
.add button.go:hover{opacity:.9}
.chips{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-2);border-radius:99px;padding:6px 11px 6px 9px;font-size:12px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.chip .sw{width:10px;height:10px;border-radius:3px;background:var(--qc);flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--qc);background:color-mix(in srgb,var(--qc) 12%,var(--surface))}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 四象限清單 ───────────────────────────────────────────── */
.group{margin-bottom:18px}
.ghead{display:flex;align-items:baseline;gap:9px;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.ghead .dot{width:11px;height:11px;border-radius:3px;background:var(--qc);flex:none;align-self:center;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.ghead .gname{font-weight:700;font-size:14.5px}
.ghead .gstrat{color:var(--ink-3);font-size:11.5px}
.ghead .gcount{margin-left:auto;color:var(--ink-2);font:500 12px/1 "IBM Plex Mono",monospace;flex:none}
.task{display:flex;align-items:flex-start;gap:11px;padding:9px 6px;border-radius:8px}
.task:hover{background:var(--surface-2)}
.task input[type=checkbox]{appearance:none;-webkit-appearance:none;width:19px;height:19px;flex:none;margin-top:2px;
  border:1.5px solid var(--ink-3);border-radius:6px;cursor:pointer;position:relative;transition:.15s;background:var(--surface)}
.task input:checked{background:var(--qc);border-color:var(--qc)}
.task input:checked::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.task input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.task .txt{flex:1;font:inherit;font-size:15px;word-break:break-word;text-align:left;
  background:none;border:none;padding:3px 6px;margin:-3px -6px;border-radius:7px;
  color:inherit;cursor:pointer;transition:background .15s}
.task .txt:hover{background:var(--surface-2)}
.task.done .txt{color:var(--ink-3);text-decoration:line-through}
.task .del{border:none;background:none;color:var(--ink-3);cursor:pointer;font-size:16px;line-height:1;
  padding:2px 4px;opacity:0;transition:opacity .15s,color .15s}
.task:hover .del,.task .del:focus-visible{opacity:1}
.task .del:hover{color:var(--q1)}
.gempty{color:var(--ink-3);font-size:12.5px;padding:4px 6px}

/* 換象限：每列右邊的小色塊 → 點開四選一 */
.task .mv{border:none;background:none;padding:4px;cursor:pointer;border-radius:6px;flex:none;
  display:grid;place-items:center;opacity:1;transition:background .15s}
.task .mv:hover{background:var(--surface-2)}
.task .mv i{display:block;width:12px;height:12px;border-radius:3px;background:var(--qc);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.mvbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:0 6px 11px 34px}
.mvbar .lbl{font-size:11.5px;color:var(--ink-3)}
.mvbar button{display:inline-flex;align-items:center;gap:6px;cursor:pointer;
  font:500 12.5px/1 inherit;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:7px 11px;transition:color .15s,border-color .15s}
.mvbar button:hover{color:var(--ink);border-color:var(--qc)}
.mvbar button .sw{width:9px;height:9px;border-radius:3px;background:var(--qc);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.mvbar .cancel{color:var(--ink-3);border-style:dashed}

.listhint{font-size:11.5px;color:var(--ink-3);text-align:center;margin:22px 0 -4px}

/* 換日提示 */
.daybar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--q2);
  border-radius:12px;padding:11px 14px;margin-bottom:16px;font-size:13px;color:var(--ink-2);
  box-shadow:var(--shadow)}
.daybar[hidden]{display:none}
.daybar b{color:var(--ink);font-weight:600}
.daybtns{display:flex;gap:7px;flex:none}
.daybar button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:8px;padding:6px 11px;font:400 12px/1 inherit;cursor:pointer;white-space:nowrap}
.daybar button:hover{color:var(--ink);border-color:var(--ink-3)}

/* 拖曳 */
.task{cursor:grab}
.task:active{cursor:grabbing}
.task.dragging{opacity:.35}
.group.dropok{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--qc);border-radius:12px}
.cell.dropok{outline:2px dashed var(--qc);outline-offset:-4px}
.tools{display:flex;justify-content:center;gap:8px;margin-top:26px}
.tools button{border:1px solid var(--line);background:var(--surface);color:var(--ink-3);
  border-radius:8px;padding:7px 13px;font:400 12.5px/1 inherit;cursor:pointer}
.tools button:hover{color:var(--ink-2);border-color:var(--ink-3)}
.tools .msg{font-size:11.5px;color:var(--ink-3);align-self:center}
.iopanel{margin-top:11px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:12px}
.iopanel textarea{width:100%;resize:vertical;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--line);border-radius:8px;padding:9px 10px;
  font:400 11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
.iopanel textarea:focus{outline:none;border-color:var(--accent)}
.iorow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.iohint{font-size:11.5px;color:var(--ink-3);flex:1;min-width:150px}
.iobtns{display:flex;gap:7px}
.iopanel button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:7px 13px;font:400 12.5px/1 inherit;cursor:pointer}
.iopanel button:hover{color:var(--ink);border-color:var(--ink-3)}
#ioAct{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:500}
#ioAct:hover{opacity:.88;color:var(--surface)}

footer{color:var(--ink-3);font-size:11.5px;text-align:center;margin-top:34px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.title{font-size:20px}.axis-y{display:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <div class="title">象限方塊</div>
      <div class="subtitle">睡前把明天的事丟進四象限 · 做完一件就填一塊</div>
    </div>
    <button class="reset mono" id="reset">新的一天</button>
  </header>

  <div class="daybar" id="dayBar" hidden>
    <span id="dayMsg"></span>
    <span class="daybtns">
      <button id="dayClear">連未完成也清掉</button>
      <button id="dayOk">知道了</button>
    </span>
  </div>

  <section class="stage">
    <div class="axis-x"><span>◀ 不緊急</span><span>緊急 ▶</span></div>
    <div class="board-row">
      <div class="axis-y" aria-hidden="true"><span>不重要 ▼</span><span>▲ 重要</span></div>
      <div class="board" id="board" role="img" aria-label="四象限完成度方塊盤"></div>
    </div>
  </section>

  <div class="summary">
    <div class="bar"><span id="barFill"></span></div>
    <div id="summaryText">今天還沒有任務</div>
  </div>

  <section class="add">
    <div class="add-row">
      <input id="taskInput" type="text" placeholder="明天要做的一件事…" maxlength="120" autocomplete="off">
      <button class="go" id="addBtn">加入</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <p class="listhint">打勾＝完成 · 點任務名稱可以換到其他象限</p>
  <section id="lists"></section>

  <div class="tools">
    <button id="expBtn">匯出</button>
    <button id="impBtn">匯入</button>
    <span class="msg" id="ioMsg"></span>
  </div>

  <div class="iopanel" id="ioPanel" hidden>
    <textarea id="ioBox" spellcheck="false" rows="4"></textarea>
    <div class="iorow">
      <span class="iohint" id="ioHint"></span>
      <span class="iobtns">
        <button id="ioAct"></button>
        <button id="ioClose">關閉</button>
      </span>
    </div>
  </div>

  <footer>
    資料只存在你這台裝置的瀏覽器裡，離線也能用。<br>
    我的第一個 vibe-coding 網頁工具 · 用艾森豪矩陣做的完成度追蹤
  </footer>
</main>

<script>
// ── 四象限定義（顏色＝你指定的紅藍黃綠；位置＝標準艾森豪矩陣）──
const QUADS = {
  1:{ name:"立即完成", strat:"重要且緊急 · 儘量減少", color:"var(--q1)", pos:"top-left"    },
  2:{ name:"制定計劃", strat:"重要不緊急 · 投入最多", color:"var(--q2)", pos:"top-right"   },
  3:{ name:"委派 / 批次", strat:"緊急不重要", color:"var(--q3)", pos:"bottom-left" },
  4:{ name:"刪除 / 限時", strat:"不重要不緊急", color:"var(--q4)", pos:"bottom-right"},
};
const ORDER = [1,2,3,4];
const KEY = "quadblocks.v1";

// ── 狀態：一個任務清單，就是全部真相 ──
let state = load();
let pickQ = 2;                 // 新增時預設落在「制定計劃」
let moveId = null;             // 目前展開「換象限」選單的任務 id
let dragId = null;             // 正在被拖曳的任務 id
let lastOn = new Set();        // 記住上一輪哪些格亮了，只讓新亮的那格 pop

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.tasks)) return d; }catch(e){}
  return { tasks:[] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

// 每象限完成度 → 幾格（0..4）：有進度至少 1 格，全做完才滿 4 格
function filledOf(q){
  const t = state.tasks.filter(x=>x.q===q);
  const total = t.length, done = t.filter(x=>x.done).length;
  if(total===0) return 0;
  if(done===total) return 4;
  return Math.max(done>0?1:0, Math.min(3, Math.round(done/total*4)));
}

// 盤面 16 格：每象限 2×2，由下往上填（俄羅斯方塊感）
// 象限位置：Q1 左上、Q2 右上、Q3 左下、Q4 右下
function quadAt(r,c){ const top=r<2, left=c<2; return top?(left?1:2):(left?3:4); }
function rankInQuad(r,c){         // 該格在象限內的填入順序：先下排(0,1) 再上排(2,3)
  const lr = r%2, lc = c%2;       // 局部座標
  const bottom = lr===1;
  return bottom ? lc : 2+lc;      // 下排 0/1，上排 2/3
}

// ── 換象限：點選單或拖曳，最後都走這一個函式 ──
function moveTask(id, q){
  const t = state.tasks.find(x=>x.id===id);
  if(!t || t.q===q) return false;
  t.q = q; moveId = null; save(); renderAll();
  return true;
}
function clearHint(){
  document.querySelectorAll(".cell.dropok,.group.dropok").forEach(el=>el.classList.remove("dropok"));
}
function hintQuad(q){            // 拖到盤面時，把整個象限（4 格）框起來
  clearHint();
  document.querySelectorAll('#board .cell[data-q="'+q+'"]').forEach(el=>el.classList.add("dropok"));
}
function dropOn(ev, q){
  clearHint();
  let id = dragId;
  try{ id = id || ev.dataTransfer.getData("text/plain"); }catch(e){}
  dragId = null;
  if(id) moveTask(id, q);
}
document.addEventListener("dragend", clearHint);

// ── 換日：隔天自己開新的一天，做完的收起來、沒做完的留著 ──
function todayStr(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function rollDay(){
  const today = todayStr();
  if(!state.day){ state.day = today; save(); return; }
  if(state.day === today) return;
  const done = state.tasks.filter(x=>x.done).length;
  const left = state.tasks.filter(x=>!x.done).length;
  state.tasks = state.tasks.filter(x=>!x.done);
  state.day = today; moveId=null; lastOn=new Set(); save();
  if(done || left) showDayBar(done, left); else hideDayBar();
}
function showDayBar(done, left){
  const bar=document.getElementById("dayBar");
  document.getElementById("dayMsg").innerHTML =
    "新的一天 · 昨天完成的 <b>"+done+"</b> 件已收起"+
    (left ? "，還沒做完的 <b>"+left+"</b> 件留下來了" : "");
  document.getElementById("dayClear").hidden = !left;
  bar.hidden = false;
}
function hideDayBar(){ document.getElementById("dayBar").hidden = true; }

function renderBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const nowOn = new Set();
  for(let r=0;r<4;r++) for(let c=0;c<4;c++){
    const q = quadAt(r,c), rank = rankInQuad(r,c);
    const on = rank < filledOf(q);
    const cell = document.createElement("div");
    cell.className = "cell" + (on?" on":"");
    cell.style.setProperty("--qc", QUADS[q].color);
    cell.dataset.q = q;
    // 也可以直接把任務拖到盤面上的那一區
    cell.addEventListener("dragover", ev=>{ ev.preventDefault(); ev.dataTransfer.dropEffect="move"; hintQuad(q); });
    cell.addEventListener("drop", ev=>{ ev.preventDefault(); dropOn(ev, q); });
    const id = r+"-"+c;
    if(on){ nowOn.add(id); if(!lastOn.has(id)) cell.classList.add("pop"); }
    // 每象限左上那格放一個小標，讓人一眼知道哪區是哪象限
    if((r===0&&c===0)||(r===0&&c===2)||(r===2&&c===0)||(r===2&&c===2)){
      const tag=document.createElement("span"); tag.className="qtag"; tag.textContent=QUADS[q].name.replace(/ /g,""); cell.appendChild(tag);
    }
    board.appendChild(cell);
  }
  lastOn = nowOn;
}

function renderSummary(){
  const total = state.tasks.length, done = state.tasks.filter(x=>x.done).length;
  const filled = ORDER.reduce((a,q)=>a+filledOf(q),0);
  const pct = Math.round(filled/16*100);
  document.getElementById("barFill").style.width = pct+"%";
  document.getElementById("summaryText").innerHTML = total===0
    ? "今天還沒有任務"
    : `完成 <b>${done}</b> / ${total} 件 · 盤面 <b>${pct}%</b>`;
}

function renderChips(){
  const box = document.getElementById("chips"); box.innerHTML="";
  for(const q of ORDER){
    const b=document.createElement("button");
    b.className="chip"; b.style.setProperty("--qc",QUADS[q].color);
    b.setAttribute("aria-pressed", q===pickQ);
    b.innerHTML=`<span class="sw"></span>${QUADS[q].name}`;
    b.onclick=()=>{ pickQ=q; renderChips(); document.getElementById("taskInput").focus(); };
    box.appendChild(b);
  }
}

function renderLists(){
  const wrap = document.getElementById("lists"); wrap.innerHTML="";
  for(const q of ORDER){
    const t = state.tasks.filter(x=>x.q===q);
    const done = t.filter(x=>x.done).length;
    const g=document.createElement("div"); g.className="group";
    g.dataset.q=q; g.style.setProperty("--qc",QUADS[q].color);
    g.addEventListener("dragover", ev=>{ ev.preventDefault(); ev.dataTransfer.dropEffect="move";
      clearHint(); g.classList.add("dropok"); });
    g.addEventListener("dragleave", ()=>g.classList.remove("dropok"));
    g.addEventListener("drop", ev=>{ ev.preventDefault(); dropOn(ev, q); });
    g.innerHTML =
      `<div class="ghead"><span class="dot" style="--qc:${QUADS[q].color}"></span>`+
      `<span class="gname">${QUADS[q].name}</span><span class="gstrat">${QUADS[q].strat}</span>`+
      `<span class="gcount">${done}/${t.length}</span></div>`;
    if(t.length===0){
      const e=document.createElement("div"); e.className="gempty"; e.textContent="—"; g.appendChild(e);
    }else{
      for(const task of t){
        const row=document.createElement("div"); row.className="task"+(task.done?" done":"");
        row.draggable=true;
        row.title="點名稱可換象限，也可以直接拖到別區";
        row.addEventListener("dragstart", ev=>{
          dragId=task.id; row.classList.add("dragging");
          ev.dataTransfer.effectAllowed="move";
          try{ ev.dataTransfer.setData("text/plain", task.id); }catch(e){}
        });
        row.addEventListener("dragend", ()=>{ dragId=null; row.classList.remove("dragging"); clearHint(); });
        const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=task.done;
        cb.style.setProperty("--qc",QUADS[q].color);
        cb.setAttribute("aria-label", (task.done?"取消完成：":"標記完成：")+task.text);
        cb.onchange=()=>{ task.done=cb.checked; save(); renderAll(); };
        // 換象限：點任務文字（或右邊小色塊）→ 展開四選一
        const toggle=()=>{ moveId = (moveId===task.id ? null : task.id); renderLists(); };

        const txt=document.createElement("button"); txt.className="txt"; txt.textContent=task.text;
        txt.setAttribute("aria-expanded", moveId===task.id);
        txt.title="點一下可換象限";
        txt.onclick=toggle;

        const mv=document.createElement("button"); mv.className="mv"; mv.innerHTML="<i></i>";
        mv.style.setProperty("--qc",QUADS[q].color);
        mv.setAttribute("aria-expanded", moveId===task.id);
        mv.setAttribute("aria-label","移動到其他象限："+task.text);
        mv.title="移動到其他象限";
        mv.onclick=toggle;

        const del=document.createElement("button"); del.className="del"; del.innerHTML="&times;";
        del.setAttribute("aria-label","刪除："+task.text);
        del.onclick=()=>{ state.tasks=state.tasks.filter(x=>x.id!==task.id); moveId=null; save(); renderAll(); };
        row.append(cb,txt,mv,del); g.appendChild(row);

        if(moveId===task.id){
          const bar=document.createElement("div"); bar.className="mvbar";
          const lbl=document.createElement("span"); lbl.className="lbl"; lbl.textContent="移到：";
          bar.appendChild(lbl);
          for(const tq of ORDER){
            if(tq===q) continue;
            const b=document.createElement("button");
            b.style.setProperty("--qc",QUADS[tq].color);
            b.innerHTML=`<span class="sw"></span>${QUADS[tq].name}`;
            b.onclick=()=>{ task.q=tq; moveId=null; save(); renderAll(); };
            bar.appendChild(b);
          }
          const cancel=document.createElement("button"); cancel.className="cancel"; cancel.textContent="取消";
          cancel.onclick=()=>{ moveId=null; renderLists(); };
          bar.appendChild(cancel);
          g.appendChild(bar);
        }
      }
    }
    wrap.appendChild(g);
  }
}

function renderAll(){ renderBoard(); renderSummary(); renderLists(); }

function addTask(){
  const inp=document.getElementById("taskInput");
  const text=inp.value.trim(); if(!text) return;
  state.tasks.push({ id:uid(), text, q:pickQ, done:false });
  inp.value=""; save(); renderAll(); inp.focus();
}

document.getElementById("addBtn").onclick=addTask;
document.getElementById("taskInput").addEventListener("keydown",e=>{ if(e.key==="Enter") addTask(); });

// 「新的一天」：兩段式確認，避免誤按清空
let armed=false, armT=null;
const rb=document.getElementById("reset");
rb.onclick=()=>{
  if(!armed){ armed=true; rb.classList.add("confirm"); rb.textContent="確定清空？";
    armT=setTimeout(()=>{ armed=false; rb.classList.remove("confirm"); rb.textContent="新的一天"; },3000); return; }
  clearTimeout(armT); armed=false; rb.classList.remove("confirm"); rb.textContent="新的一天";
  state.tasks=[]; state.day=todayStr(); moveId=null; lastOn=new Set(); save(); renderAll(); hideDayBar();
};

// 換日提示條上的兩顆鈕
document.getElementById("dayOk").onclick = hideDayBar;
document.getElementById("dayClear").onclick = ()=>{
  state.tasks=[]; moveId=null; lastOn=new Set(); save(); renderAll(); hideDayBar();
};
// 頁面放著過夜、或從別的分頁切回來時，也檢查一次日期
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden) return;
  const before = state.day;
  rollDay();
  if(before !== state.day) renderAll();
});

// 匯出／匯入：資料是你的。用純文字搬家，換一個網址也帶得走。
const ioMsg=document.getElementById("ioMsg"), ioPanel=document.getElementById("ioPanel"),
      ioBox=document.getElementById("ioBox"), ioHint=document.getElementById("ioHint"),
      ioAct=document.getElementById("ioAct");
let msgT=null, ioMode=null;
function say(t){
  ioMsg.textContent=t;
  clearTimeout(msgT); msgT=setTimeout(()=>{ ioMsg.textContent=""; },4000);
}
function closeIO(){ ioPanel.hidden=true; ioMode=null; ioBox.value=""; }

document.getElementById("expBtn").onclick=()=>{
  ioMode="export"; ioPanel.hidden=false;
  ioBox.readOnly=true;
  ioBox.value=JSON.stringify(state);
  ioHint.textContent="這段文字就是你的資料。複製起來，貼到另一個網址的「匯入」就搬過去了。";
  ioAct.textContent="複製";
  ioBox.focus(); ioBox.select();
};
document.getElementById("impBtn").onclick=()=>{
  ioMode="import"; ioPanel.hidden=false;
  ioBox.readOnly=false; ioBox.value="";
  ioHint.textContent="把之前匯出的那段文字貼進來，會覆蓋目前的任務。";
  ioAct.textContent="匯入";
  ioBox.focus();
};
document.getElementById("ioClose").onclick=closeIO;

ioAct.onclick=()=>{
  if(ioMode==="export"){
    ioBox.select();
    let done=false;
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ioBox.value).then(()=>say("已複製")).catch(()=>say("已選取，請按 ⌘/Ctrl + C"));
        done=true;
      }
    }catch(e){}
    if(!done) say("已選取，請按 ⌘/Ctrl + C");
    return;
  }
  try{
    const d=JSON.parse(ioBox.value.trim());
    if(!d||!Array.isArray(d.tasks)) throw 0;
    const clean=d.tasks
      .filter(x=>x&&typeof x.text==="string"&&QUADS[x.q])
      .map(x=>({id:x.id||uid(), text:String(x.text).slice(0,120), q:x.q, done:!!x.done}));
    if(!clean.length) throw 0;
    state={tasks:clean, day:todayStr()}; moveId=null; lastOn=new Set(); save(); renderAll();
    closeIO(); hideDayBar(); say("已匯入 "+clean.length+" 件");
  }catch(e){ say("這段文字讀不出來，請確認是完整複製的"); }
};

rollDay();
renderChips(); renderAll();
</script>
